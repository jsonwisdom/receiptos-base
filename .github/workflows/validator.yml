name: ReceiptOS Validator CI

on:
  push:
  pull_request:

# Validator workflow aligned with the current repository architecture.
# Legacy ci/scripts entrypoints (run_lint.sh, run_schema.sh, run_unit.sh,
# run_integration.sh, summarize.sh) were removed after migration to the
# fixture-based validator harness. Only paths backed by actual repository
# contents are retained.

jobs:
  fixtures:
    name: Fixture Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute fixture suite
        run: ci/scripts/run_fixtures.sh
        # NOTE: run_fixtures.sh requires REF_VALIDATOR and CAND_VALIDATOR
        # environment variables. These must be supplied by the calling
        # context or by a follow-on configuration change if the job is
        # to succeed. The script itself is present and executable.
