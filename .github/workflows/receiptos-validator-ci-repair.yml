name: ReceiptOS Validator CI Repair

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  validator-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validator test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Install and expose existing ReceiptOS CLI
        run: |
          npm install
          npm link
          command -v receiptos
          receiptos --help >/dev/null

      - name: Run restored validator preflight
        run: ./ci/scripts/run_lint.sh

      - name: Run validator tests
        run: python -m pytest
