[project]
name = "ep-validator"
version = "0.1.0"
description = "EP Protocol Validator - Reference Implementation (M1 Slice 1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "EP Project"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-xdist>=3.0",
  "hypothesis>=6.0",
  "jsonschema>=4.23",
  "cryptography>=44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "7.0"
addopts = "-v --strict-markers"
pythonpath = ["."]
